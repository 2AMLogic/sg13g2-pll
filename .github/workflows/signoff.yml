name: klt signoff (block tier report)

# The graded-T1-state gate for manifests/sg13g2-pll.json (issue #104).
#
# Re-runs `klt signoff --manifest` at the exact upstream commit the
# committed evidence self-attests (the ERC envelopes' provenance.klt_version
# is klt 0.5.0+gb15edf5e3a2e; the commit bundles the 11-item tier doc whose
# item-11 grading rules match the running build), then byte-compares the
# fresh report against manifests/sg13g2-pll.tier-report.json — the verdict
# of record the gap-to-T1 tracker (issue #6) points at.
#
# Pass contract:
#   * `klt signoff` exit 0 (every T1 item met) or 3 (graded, unmet items
#     remain — the current, expected state) both count as "ran and graded";
#     exit 1/2 means the grade itself errored and fails this workflow.
#   * The fresh report must be byte-identical to the committed one. Any
#     drift — an evidence artifact changed without re-grading (a pinned
#     content_hash renders stale_evidence), a row flipping met/unmet, an
#     evidence file moved or deleted — fails here. Refresh the verdict by
#     regenerating and recommitting the report, never by hand-editing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned grading build of klt
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/2AMLogic/klayout-tools "$RUNNER_TEMP/klt"
          git -C "$RUNNER_TEMP/klt" checkout --quiet b15edf5e3a2e56467a3406c98a2555eb1a5ae45c
          python -m venv "$RUNNER_TEMP/klt-venv"
          # klayout is pinned to the graded commit's own uv.lock entry
          # (KLAYOUT_VERSION_EXPECTED at this build: 0.30.10) so the
          # engine that produced the committed report is the engine that
          # re-grades it — the byte-compare below must not drift on a
          # dependency floor resolving to a newer wheel.
          "$RUNNER_TEMP/klt-venv/bin/pip" install --quiet "klayout==0.30.10" "$RUNNER_TEMP/klt"
          "$RUNNER_TEMP/klt-venv/bin/klt" --version

      - name: Re-run the block grade (command-backed citations re-run live)
        run: |
          set +e
          PATH="$RUNNER_TEMP/klt-venv/bin:$PATH" \
            klt signoff --manifest manifests/sg13g2-pll.json --format json \
            > "$RUNNER_TEMP/fresh-tier-report.json" 2> "$RUNNER_TEMP/signoff.stderr"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff errored (exit $rc) — nothing was graded. Stderr:"
            cat "$RUNNER_TEMP/signoff.stderr"
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "klt signoff exit 3: graded with unmet T1 items (expected for this block's current state)."
          else
            echo "klt signoff exit 0: every rendered T1 item is met."
          fi

      - name: Byte-compare the fresh grade against the committed verdict
        run: |
          set -euo pipefail
          if cmp --silent manifests/sg13g2-pll.tier-report.json "$RUNNER_TEMP/fresh-tier-report.json"; then
            echo "Verdict of record is fresh: committed tier report byte-identical to the re-run grade."
            exit 0
          fi
          set +e
          python3 - "$RUNNER_TEMP/fresh-tier-report.json" <<'PY'
          import json, sys

          committed = json.load(open("manifests/sg13g2-pll.tier-report.json"))
          fresh = json.load(open(sys.argv[1]))

          def key(it):
              return (it.get("tier"), it.get("id"), it.get("partition"))

          def row(it):
              cite = it.get("citation") or {}
              c = cite.get("file") or cite.get("command") or ""
              return f"[{it['status']:>5}] reason={it.get('reason')} cite={c}"

          ca = {key(i): i for i in committed.get("items", [])}
          fa = {key(i): i for i in fresh.get("items", [])}
          drifted = False
          for k in sorted(ca.keys() | fa.keys(), key=lambda t: (str(t[0]), t[1] or 0, str(t[2]))):
              if k not in fa:
                  print(f"  {k}: removed from the fresh report (was: {row(ca[k])})"); drifted = True
              elif k not in ca:
                  print(f"  {k}: new in the fresh report ({row(fa[k])})"); drifted = True
              elif ca[k].get("status") != fa[k].get("status") or ca[k].get("reason") != fa[k].get("reason"):
                  print(f"  {k}:\n    committed  {row(ca[k])}\n    fresh       {row(fa[k])}"); drifted = True
          for f in ("tier", "t1_item_count", "build_t1_item_count", "t1_met_count", "source_doc", "source_doc_content_hash"):
              if committed.get(f) != fresh.get(f):
                  print(f"  top-level '{f}': committed={committed.get(f)!r} fresh={fresh.get(f)!r}"); drifted = True
          if committed.get("build") != fresh.get("build"):
              print(f"  build block: committed={committed.get('build')!r}\n             fresh={fresh.get('build')!r}"); drifted = True
          if not drifted:
              print("  (no semantic row drift — byte difference only. Still a mismatch: the report is byte-compared.)")
          sys.exit(1)
          PY
          set -e
          echo "::error::Drift between the committed tier report and the re-run grade:"
          echo "A pinned content_hash that renders stale_evidence, a flipped met/unmet row,"
          echo "a moved/deleted evidence file, or a changed grader all show up here. Regenerate"
          echo "manifests/sg13g2-pll.tier-report.json with the pinned klt build (see"
          echo "manifests/README.md) and recommit — never hand-edit the report."
          exit 1
