name: klt signoff (block tier report)

# The graded-T1-state gate for manifests/sg13g2-pll.json (issue #104).
#
# Re-runs `klt signoff --manifest` at a pinned upstream commit
# (e6284fbe62e2, klt 0.6.0+ge6284fbe62e2: the first commit whose manifest
# evidence bindings accept an RFC 6901 "pointer", klayout-tools#2376, which
# the item-4 citations need to reach the klt envelope under /response of the
# LVS wrapper reports; the 11-item tier doc is unchanged in effect, see
# manifests/README.md), then byte-compares the fresh report against
# manifests/sg13g2-pll.tier-report.json — the verdict of record the
# gap-to-T1 tracker (issue #6) points at. A separate step first runs
# manifests/check_lvs_coverage.py so the single item-4 analog citation
# cannot hide a missing or stale sibling block, and
# manifests/check_erc_coverage.py so the single item-11 analog citation
# cannot hide a missing, stale or defective sibling ERC report, and
# manifests/check_drc_coverage.py so the single live item-3 divider DRC
# command cannot hide a missing, failed, violating or stale sibling report.
#
# Pass contract:
#   * `klt signoff` exit 0 (every T1 item met) or 3 (graded, unmet items
#     remain — the current, expected state) both count as "ran and graded";
#     exit 1/2 means the grade itself errored and fails this workflow.
#   * The fresh report must be byte-identical to the committed one. Any
#     drift — an evidence artifact changed without re-grading (a pinned
#     content_hash renders stale_evidence), a row flipping met/unmet, an
#     evidence file moved or deleted — fails here. Refresh the verdict by
#     regenerating and recommitting the report, never by hand-editing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Evidence-record hygiene (issue #180, T1 item 10): sim/**/records/ numbering,
  # required format, characterization/sources.json coverage, and (pull requests
  # only) append-only enforcement: a PR that deletes, renames or edits a record
  # already on the base branch fails. Offline, stdlib-only, runs no simulation.
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Records checker unit tests
        run: python3 characterization/test_check_records.py

      - name: Records format, numbering and sources.json coverage
        run: python3 characterization/check_records.py

      - name: Records are append-only (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 characterization/check_records.py --base "origin/$BASE_REF"

  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Item-4 coverage gate (all analog LVS envelopes vs adjacent GDS)
        run: |
          python3 manifests/check_lvs_coverage.py
          python3 manifests/test_check_lvs_coverage.py

      # T1 item 3: the manifest grades one live divider `klt drc` command.
      # This gate requires every one of the six composed blocks' committed
      # DRC wrapper in the authoritative LVS/layout record to be ok, clean
      # with zero violations, hash-bound to its adjacent GDS, and to retain
      # its coverage disclosures (starter-deck completeness not required),
      # and that the live divider command binds to the same divider content.
      - name: Item-3 DRC sibling coverage gate (six composed-block DRC reports)
        run: |
          python3 manifests/check_drc_coverage.py
          python3 manifests/test_check_drc_coverage.py

      # T1 item 11 analog: one [erc, lvs] citation stands for five blocks, so
      # every block's committed `klt erc` supply report is checked here (same
      # input as its LVS envelope, declared supplies paired in LVS, ties
      # checked, nothing skipped/unknown). With the committed tier report at
      # 11.analog `met`, all five must be clean; an `unmet` state must name
      # each defective block's follow-up (KNOWN_DEFECTS in the script).
      - name: Item-11 analog coverage gate (all five analog ERC supply reports)
        run: |
          python3 manifests/check_erc_coverage.py
          python3 manifests/test_check_erc_coverage.py

      # Characterization summary (issue #171): characterization/SUMMARY.md is
      # generated from the sim/ files named in characterization/sources.json.
      # Fails if a listed source is missing or its sha256 changed, if a
      # min/max or any other rendered line no longer matches a fresh
      # generation, or if SUMMARY.md is stale. Offline; runs no simulation.
      - name: Characterization summary (source hashes, extrema, freshness)
        run: |
          python3 characterization/test_gen_summary.py
          python3 characterization/gen_summary.py --check

      # T1 item 7: the manifest cites only the vco and divider_chain PEX
      # envelopes. This gate validates all five nominal klt pex reports
      # (status, body bias, GDS input hash, block identity) and that the
      # flattened schematic legs match a fresh re-flatten of the design
      # exports. lock_detector stays withheld (#157). Nominal evidence
      # integrity only -- not a PVT/spec pass.
      - name: Item-7 PEX sibling coverage gate (five nominal envelopes + legs)
        run: |
          python3 manifests/check_pex_coverage.py
          python3 manifests/test_check_pex_coverage.py

      # T1 item 9: every sim/ bench must be indexed in sim/README.md "Cold
      # start" with an executable entry point and documented invocation, and
      # every record must cite a PDK revision + tool version consistent with
      # the pin. Pre-gate records (append-only) are grandfathered in
      # KNOWN_DEFECTS (#182); item 9 stays unmet and uncited until it clears.
      - name: Item-9 testbench coverage and PDK-pin gate (sim/ benches + records)
        run: |
          python3 manifests/check_testbench_coverage.py
          python3 manifests/test_check_testbench_coverage.py

      # Spec citation gate: every Measured-by bench/record, R-n and DR-NNN in
      # spec/target-spec.md's Row table resolves. Structure only; never reads
      # bounds or Status vs measured compliance. Offline, seconds.
      - name: Spec row-table citation gate (benches, records, R-n, DR-NNN)
        run: |
          python3 manifests/check_spec_citations.py
          python3 manifests/test_check_spec_citations.py

      - name: Install the pinned grading build of klt
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/2AMLogic/klayout-tools "$RUNNER_TEMP/klt"
          git -C "$RUNNER_TEMP/klt" checkout --quiet e6284fbe62e25d9b293eed07889cb80a0b87e2f4
          python -m venv "$RUNNER_TEMP/klt-venv"
          # klayout is pinned to the graded commit's own uv.lock entry
          # (0.30.10 at this build, unchanged from the previous pin) so the
          # engine that produced the committed report is the engine that
          # re-grades it — the byte-compare below must not drift on a
          # dependency floor resolving to a newer wheel.
          "$RUNNER_TEMP/klt-venv/bin/pip" install --quiet "klayout==0.30.10" "$RUNNER_TEMP/klt"
          "$RUNNER_TEMP/klt-venv/bin/klt" --version

      - name: Re-run the block grade (command-backed citations re-run live)
        run: |
          set +e
          PATH="$RUNNER_TEMP/klt-venv/bin:$PATH" \
            klt signoff --manifest manifests/sg13g2-pll.json --format json \
            > "$RUNNER_TEMP/fresh-tier-report.json" 2> "$RUNNER_TEMP/signoff.stderr"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff errored (exit $rc) — nothing was graded. Stderr:"
            cat "$RUNNER_TEMP/signoff.stderr"
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "klt signoff exit 3: graded with unmet T1 items (expected for this block's current state)."
          else
            echo "klt signoff exit 0: every rendered T1 item is met."
          fi

      - name: Byte-compare the fresh grade against the committed verdict
        run: |
          set -euo pipefail
          if cmp --silent manifests/sg13g2-pll.tier-report.json "$RUNNER_TEMP/fresh-tier-report.json"; then
            echo "Verdict of record is fresh: committed tier report byte-identical to the re-run grade."
            exit 0
          fi
          set +e
          python3 - "$RUNNER_TEMP/fresh-tier-report.json" <<'PY'
          import json, sys

          committed = json.load(open("manifests/sg13g2-pll.tier-report.json"))
          fresh = json.load(open(sys.argv[1]))

          def key(it):
              return (it.get("tier"), it.get("id"), it.get("partition"))

          def row(it):
              cite = it.get("citation") or {}
              c = cite.get("file") or cite.get("command") or ""
              return f"[{it['status']:>5}] reason={it.get('reason')} cite={c}"

          ca = {key(i): i for i in committed.get("items", [])}
          fa = {key(i): i for i in fresh.get("items", [])}
          drifted = False
          for k in sorted(ca.keys() | fa.keys(), key=lambda t: (str(t[0]), t[1] or 0, str(t[2]))):
              if k not in fa:
                  print(f"  {k}: removed from the fresh report (was: {row(ca[k])})"); drifted = True
              elif k not in ca:
                  print(f"  {k}: new in the fresh report ({row(fa[k])})"); drifted = True
              elif ca[k].get("status") != fa[k].get("status") or ca[k].get("reason") != fa[k].get("reason"):
                  print(f"  {k}:\n    committed  {row(ca[k])}\n    fresh       {row(fa[k])}"); drifted = True
          for f in ("tier", "t1_item_count", "build_t1_item_count", "t1_met_count", "source_doc", "source_doc_content_hash"):
              if committed.get(f) != fresh.get(f):
                  print(f"  top-level '{f}': committed={committed.get(f)!r} fresh={fresh.get(f)!r}"); drifted = True
          if committed.get("build") != fresh.get("build"):
              print(f"  build block: committed={committed.get('build')!r}\n             fresh={fresh.get('build')!r}"); drifted = True
          if not drifted:
              print("  (no semantic row drift — byte difference only. Still a mismatch: the report is byte-compared.)")
          sys.exit(1)
          PY
          set -e
          echo "::error::Drift between the committed tier report and the re-run grade:"
          echo "A pinned content_hash that renders stale_evidence, a flipped met/unmet row,"
          echo "a moved/deleted evidence file, or a changed grader all show up here. Regenerate"
          echo "manifests/sg13g2-pll.tier-report.json with the pinned klt build (see"
          echo "manifests/README.md) and recommit — never hand-edit the report."
          exit 1
