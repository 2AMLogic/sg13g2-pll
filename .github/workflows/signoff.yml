name: klt signoff (block tier report)

# The graded-T1-state gate for manifests/sg13g2-pll.json (issue #104).
#
# Re-runs `klt signoff --manifest` at a pinned upstream release
# (klayout-tools==0.8.0 from PyPI, klayout 0.30.12 -- the version 0.8.0
# itself resolves; a release containing the `klt signoff --attest` producer,
# klayout-tools#2844, which item 10 needs, and still accepting the RFC 6901
# "pointer" bindings, klayout-tools#2376, that the item-4 citations use to
# reach the klt envelope under /response of the LVS wrapper reports; see
# manifests/README.md), then byte-compares the fresh report against
# manifests/sg13g2-pll.tier-report.json — the verdict of record the
# gap-to-T1 tracker (issue #6) points at.
#
# The offline stdlib gates this block runs are not listed here. They are
# written once, in manifests/inventories/item-10.json's `checks` list
# (issue #503, the one-source ruling): the `records` job runs exactly that
# list through scripts/run_gates.py — the same list the local `pnpm test`
# / `check:ci` run — and the `grade` job's `klt signoff --attest 10`
# re-executes every entry of it. So the item-4 analog LVS envelopes cannot
# hide a missing or stale sibling block (manifests/check_lvs_coverage.py),
# the single item-11 analog citation a missing, stale or defective sibling
# ERC report (check_erc_coverage.py), and the live item-3 divider DRC
# command a missing, failed, violating or stale sibling report
# (check_drc_coverage.py) — each of those gates is in the list, run in
# `records` and re-run by the re-attest in `grade`.
#
# Steps that only make sense in CI stay plain workflow steps: the base-ref
# append-only record check (needs a PR base), the pinned klt install, the
# two `klt signoff --attest` steps (they are the gate, not a gate in the
# list) and the byte-compare below.
#
# Pass contract:
#   * `klt signoff` exit 0 (every T1 item met) or 3 (graded, unmet items
#     remain — the current, expected state) both count as "ran and graded";
#     exit 1/2 means the grade itself errored and fails this workflow.
#   * The fresh report must be byte-identical to the committed one. Any
#     drift — an evidence artifact changed without re-grading (a pinned
#     content_hash renders stale_evidence), a row flipping met/unmet, an
#     evidence file moved or deleted — fails here. Refresh the verdict by
#     regenerating and recommitting the report, never by hand-editing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The repo's offline stdlib gates — records hygiene (issue #180, T1 item
  # 10), the six manifests coverage checks, the spec citation gate, the
  # characterization summary check and the sim/ self-tests — run from the
  # single source: item-10.json's `checks` list, via scripts/run_gates.py
  # (#503, replacing the #395 parity checker). The runner prints each
  # gate's inventory name as it starts, so a CI log still shows which gate
  # failed. Stdlib-only, offline, runs no simulation.
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline stdlib gates (the item-10 checks list)
        run: python3 -B scripts/run_gates.py

      # CI-only step, deliberately not in the inventory: append-only
      # enforcement needs a PR base ref (origin/$BASE_REF) and there is no
      # base to diff against at attest time.
      - name: Records are append-only (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 characterization/check_records.py --base "origin/$BASE_REF"

  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The item-3/4/7/9/11 coverage gates, the characterization summary
      # check and the spec citation gate used to run as explicit steps
      # here; they are entries of the item-10 inventory, and the re-attest
      # of item 10 below re-executes every one of them, so the hand-written
      # duplicates are gone (#503).

      - name: Install the pinned grading build of klt
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/klt-venv"
          # klayout is pinned to the version klayout-tools 0.8.0 itself
          # resolves (0.30.12) so the engine that produced the committed
          # report is the engine that re-grades it -- the byte-compare below
          # must not drift on a dependency floor resolving to a newer wheel.
          "$RUNNER_TEMP/klt-venv/bin/pip" install --quiet "klayout==0.30.12" "klayout-tools==0.8.0"
          "$RUNNER_TEMP/klt-venv/bin/klt" --version
          test "$("$RUNNER_TEMP/klt-venv/bin/klt" --version)" = "klt 0.8.0"

      - name: Re-run the block grade (command-backed citations re-run live)
        run: |
          set +e
          PATH="$RUNNER_TEMP/klt-venv/bin:$PATH" \
            klt signoff --manifest manifests/sg13g2-pll.json --format json \
            > "$RUNNER_TEMP/fresh-tier-report.json" 2> "$RUNNER_TEMP/signoff.stderr"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff errored (exit $rc) — nothing was graded. Stderr:"
            cat "$RUNNER_TEMP/signoff.stderr"
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "klt signoff exit 3: graded with unmet T1 items (expected for this block's current state)."
          else
            echo "klt signoff exit 0: every rendered T1 item is met."
          fi

      # T1 item 10: the attestation envelope is produced by `klt signoff
      # --attest 10` from manifests/inventories/item-10.json. Re-attesting
      # re-runs every inventoried check -- the repo's whole offline gate
      # set -- and diffs the envelope, so a changed or missing hygiene
      # file, or a failing gate, fails here (the manifest pin alone only
      # binds the inventory file itself).
      - name: Re-attest T1 item 10 (repo hygiene inventory vs committed envelope)
        run: |
          PATH="$RUNNER_TEMP/klt-venv/bin:$PATH" \
            klt signoff --attest 10 \
              --inventory manifests/inventories/item-10.json \
              --check manifests/inventories/item-10.envelope.json

      # T1 item 1: the attestation envelope is produced by `klt signoff
      # --attest 1` from manifests/inventories/item-1.json. Re-attesting fails
      # if a source schematic or derived netlist drifts (both are hashed into
      # the envelope) or a netlist is stale against manifests/check_netlist_stamp.py.
      # Honest gap: this job installs no xschem, so the per-netlist freshness
      # check is that offline digest stamp, not a regeneration; the xschem
      # regeneration gate is netlist.yml (design/netlist.sh --check).
      - name: Re-attest T1 item 1 (design sources + netlists vs committed envelope)
        run: |
          PATH="$RUNNER_TEMP/klt-venv/bin:$PATH" \
            klt signoff --attest 1 \
              --inventory manifests/inventories/item-1.json \
              --check manifests/inventories/item-1.envelope.json

      - name: Byte-compare the fresh grade against the committed verdict
        run: |
          set -euo pipefail
          if cmp --silent manifests/sg13g2-pll.tier-report.json "$RUNNER_TEMP/fresh-tier-report.json"; then
            echo "Verdict of record is fresh: committed tier report byte-identical to the re-run grade."
            exit 0
          fi
          set +e
          python3 - "$RUNNER_TEMP/fresh-tier-report.json" <<'PY'
          import json, sys

          committed = json.load(open("manifests/sg13g2-pll.tier-report.json"))
          fresh = json.load(open(sys.argv[1]))

          def key(it):
              return (it.get("tier"), it.get("id"), it.get("partition"))

          def row(it):
              cite = it.get("citation") or {}
              c = cite.get("file") or cite.get("command") or ""
              return f"[{it['status']:>5}] reason={it.get('reason')} cite={c}"

          ca = {key(i): i for i in committed.get("items", [])}
          fa = {key(i): i for i in fresh.get("items", [])}
          drifted = False
          for k in sorted(ca.keys() | fa.keys(), key=lambda t: (str(t[0]), t[1] or 0, str(t[2]))):
              if k not in fa:
                  print(f"  {k}: removed from the fresh report (was: {row(ca[k])})"); drifted = True
              elif k not in ca:
                  print(f"  {k}: new in the fresh report ({row(fa[k])})"); drifted = True
              elif ca[k].get("status") != fa[k].get("status") or ca[k].get("reason") != fa[k].get("reason"):
                  print(f"  {k}:\n    committed  {row(ca[k])}\n    fresh       {row(fa[k])}"); drifted = True
          for f in ("tier", "t1_item_count", "build_t1_item_count", "t1_met_count", "source_doc", "source_doc_content_hash"):
              if committed.get(f) != fresh.get(f):
                  print(f"  top-level '{f}': committed={committed.get(f)!r} fresh={fresh.get(f)!r}"); drifted = True
          if committed.get("build") != fresh.get("build"):
              print(f"  build block: committed={committed.get('build')!r}\n             fresh={fresh.get('build')!r}"); drifted = True
          if not drifted:
              print("  (no semantic row drift — byte difference only. Still a mismatch: the report is byte-compared.)")
          sys.exit(1)
          PY
          set -e
          echo "::error::Drift between the committed tier report and the re-run grade:"
          echo "A pinned content_hash that renders stale_evidence, a flipped met/unmet row,"
          echo "a moved/deleted evidence file, or a changed grader all show up here. Regenerate"
          echo "manifests/sg13g2-pll.tier-report.json with the pinned klt build (see"
          echo "manifests/README.md) and recommit — never hand-edit the report."
          exit 1
