name: netlist regeneration gate (T1 item 1)

# T1 item 1 ("Design sources") requires the netlist be regenerated on design
# change. This job regenerates every committed netlist with its committed
# generator (design/netlist.sh, design/sg13cmos5l/netlist.sh) and fails on
# `git diff` against the committed copy (issue #151).
#
# Honest gaps (not hidden):
#   * xschem comes from the runner's apt package, not a pinned container. The
#     committed netlists carry a `* xschem XSCHEM Vx.y.z` banner line; the
#     runner's xschem version can differ from the one that generated the
#     committed files (committed: 3.4.7), so ONLY that banner line is
#     excluded from the diff (git diff -I). Every other line must match.
#   * Both PDKs are pinned. SG13CMOS5L is pinned to the commit used for the
#     committed netlists' host. The host SG13G2 copy has no recorded revision
#     (its symbols date from March 2026), so IHP-Open-PDK is pinned to the
#     last commit before upstream began emitting mm_ok=1 (2682d8e); default
#     branch HEAD emits it and would drift every device line. If a pin is
#     bumped, the netlists must be regenerated deliberately.
#   * Observed green on a GitHub runner (PR #155) after the PDK layout and
#     pin fixes; the local run (xschem 3.4.4, banner line ignored) also
#     reproduced all 12 committed netlists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netlists:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xschem (runner apt package; not version-pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xschem xvfb
          xschem --version | head -1

      - name: Fetch the PDKs
        run: |
          set -euo pipefail
          # Two PDK trees are needed under one PDK_ROOT ($RUNNER_TEMP/pdk):
          #   ihp-sg13g2/       -> the ihp-sg13g2 variant of an old IHP-Open-PDK pin
          #   ihp-sg13cmos5l/   -> the ihp-sg13cmos5l/ subtree of the unified
          #                        IHP-Open-PDK (the split IHP-GmbH repo of the
          #                        same name is archived)
          # The cmos5l model/symbol symlinks are relative (../../../../ihp-sg13g2/...)
          # and must resolve to a sibling ihp-sg13g2 under PDK_ROOT, so the cmos5l
          # subtree is COPIED (not symlinked) into PDK_ROOT: a symlinked variant dir
          # would resolve those links inside the unified tree instead.
          mkdir -p "$RUNNER_TEMP/pdk"
          # ihp-sg13g2: pinned to the last commit before the mm_ok symbol change
          # (00fd98f, 2026-05-22), which appends mm_ok=1 to every device line.
          git init --quiet "$RUNNER_TEMP/IHP-Open-PDK"
          git -C "$RUNNER_TEMP/IHP-Open-PDK" fetch --quiet --depth 1 https://github.com/IHP-GmbH/IHP-Open-PDK 2682d8ef855b8b33e12bc0d13b4f1d023c79ef9e
          git -C "$RUNNER_TEMP/IHP-Open-PDK" checkout --quiet FETCH_HEAD
          ln -s "$RUNNER_TEMP/IHP-Open-PDK/ihp-sg13g2" "$RUNNER_TEMP/pdk/ihp-sg13g2"
          # ihp-sg13cmos5l: immutable exact-commit tarball, fail-closed on SHA256
          # (never follows moving dev). The hash was verified by downloading the
          # archive independently (issue #252); a mismatch aborts before extraction.
          CMOS5L_COMMIT=f7bca32694fe3d58be0cc7d9df4b9f5db7161a14
          CMOS5L_SHA256=5eb6f8a9b0b2ecc4fa08cc30627668406f85b1a97834f278036c43f0c0dbc70b
          mkdir -p "$RUNNER_TEMP/pdk-dl" "$RUNNER_TEMP/pdk-unified"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pdk-dl/pdk.tgz" "https://codeload.github.com/IHP-GmbH/IHP-Open-PDK/tar.gz/$CMOS5L_COMMIT"
          echo "$CMOS5L_SHA256  $RUNNER_TEMP/pdk-dl/pdk.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pdk-dl/pdk.tgz" -C "$RUNNER_TEMP/pdk-unified" --strip-components=1 "IHP-Open-PDK-$CMOS5L_COMMIT/ihp-sg13cmos5l"
          cp -a "$RUNNER_TEMP/pdk-unified/ihp-sg13cmos5l" "$RUNNER_TEMP/pdk/ihp-sg13cmos5l"
          test -f "$RUNNER_TEMP/pdk/ihp-sg13cmos5l/libs.tech/xschem/xschemrc"

      - name: Regenerate netlists and fail on drift
        run: |
          set -euo pipefail
          # design/xschemrc sources $PDK_ROOT/$PDK/libs.tech/xschem/xschemrc.
          PDK_ROOT="$RUNNER_TEMP/IHP-Open-PDK" PDK=ihp-sg13g2 xvfb-run -a ./design/netlist.sh
          PDK_ROOT="$RUNNER_TEMP/pdk" PDK=ihp-sg13cmos5l xvfb-run -a ./design/sg13cmos5l/netlist.sh
          if ! git diff --exit-code -I'^\* xschem XSCHEM V' -- design; then
            echo "::error::Committed netlists differ from what the committed generators emit from the committed .sch. Regenerate with design/netlist.sh and design/sg13cmos5l/netlist.sh and commit."
            exit 1
          fi
          # Modified tracked files were already judged by the diff above (which
          # ignores the version banner); here catch generated-but-uncommitted.
          if git status --porcelain --untracked-files=all -- design | grep '^??'; then
            echo "::error::Generators produced untracked files under design/ (a generated netlist is not committed)."
            exit 1
          fi
          echo "Committed netlists match regenerated output (xschem version banner line excluded)."
